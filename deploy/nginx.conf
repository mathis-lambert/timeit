server {
    listen 80;
    server_name _;
    server_tokens off;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location = /updates/appcast.xml {
        alias /srv/updates/appcast.xml;
        default_type application/xml;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Reserved for the future presentation site. Never expose directory contents.
    location / {
        return 404;
    }
}
